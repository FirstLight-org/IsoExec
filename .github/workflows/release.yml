name: Release
# If pyproject.toml says version = "0.1.0", push tag v0.1.0 on the commit to release.
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make build RELEASE_TAG="$GITHUB_REF_NAME"
      - run: make check-wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/isoexec-*.tar.gz
            dist/isoexec-*.whl
          if-no-files-found: error

  create-release:
    needs: build-and-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Draft a GitHub Release with the sdist and wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/isoexec-*.tar.gz dist/isoexec-*.whl
          --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME"
